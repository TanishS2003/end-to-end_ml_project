name: Deploy to AWS EC2

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'README.md' ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Deploy to EC2
      env:
        PRIVATE_KEY: ${{ secrets.AWS_EC2_KEY }}
        HOST: ${{ secrets.AWS_EC2_HOST }}
        USER: ${{ secrets.AWS_EC2_USER }}
        REPO_NAME: ${{ secrets.REPO_NAME }}

      run: |
        echo "$PRIVATE_KEY" > private_key.pem
        chmod 600 private_key.pem

        ssh -o StrictHostKeyChecking=no -i private_key.pem ${USER}@${HOST} << ENDSSH

          echo "🚀 Starting deployment"

          cd ~/${REPO_NAME}

          echo "📥 Fetching latest code"
          git fetch origin

          echo "🔄 Resetting repo to latest version"
          git reset --hard origin/main

          echo "🐍 Activating virtual environment"
          source venv/bin/activate

          echo "📦 Installing dependencies"
          pip install -r requirements.txt

          echo "🔄 Restarting Streamlit service"
          sudo systemctl restart streamlit

          echo "📊 Checking service status"
          sudo systemctl status streamlit --no-pager

        ENDSSH

        rm -f private_key.pem

    - name: Deployment Success
      if: success()
      run: |
        echo "✅ Deployment successful!"
        echo "App URL: http://${{ secrets.AWS_EC2_HOST }}:8501"

    - name: Deployment Failed
      if: failure()
      run: |
        echo "❌ Deployment failed. Check logs."